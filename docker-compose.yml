services:
  db:
    image: postgres:16-alpine
    container_name: oversee-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-oversee}
      POSTGRES_USER: ${POSTGRES_USER:-oversee}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-oversee_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-oversee} -d ${POSTGRES_DB:-oversee}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: oversee_postgres_data
