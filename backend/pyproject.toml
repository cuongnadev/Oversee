[project]
name = "oversee-backend"
version = "0.1.0"
description = "Backend API for Oversee task management system"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi[standard]>=0.157.0",
    "uvicorn>=0.35.0",
    "pydantic-settings>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.11.0",
]

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
